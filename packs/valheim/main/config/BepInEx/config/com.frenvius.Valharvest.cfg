[Bone Appetit]

## When BoneAppetit is installed, use its cooking stations instead of Valharvest's. Has no effect if BoneAppetit is not installed.
# Setting type: Boolean
# Default value: false
UseBoneAppetitCookingStations = false

## Internal flag: tracks whether the one-time BoneAppetit cooking-stations notice has already been dismissed by the user.
# Setting type: Boolean
# Default value: false
