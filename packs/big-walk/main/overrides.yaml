# Maintainer settings for this pack (SPEC §4.4). Re-imports never change this file;
# the publisher GUI rewrites it (keeping these explanations, but not other comments).
schema: 1

# name: Pack name shown to players (default: the name given to new-pack)
# description: One or two sentences shown to players

# Config access for every mod that doesn't set its own, and for config files with no owner:
#   hidden   - players never see configs; files are reset to the pack's version before each launch
#   locked   - players can view but not edit; reset like hidden
#   editable - players can edit; their changes survive pack updates
defaultConfigAccess: editable

# Per-mod settings. Any key can be left out to use the default.
mods: {}
#  Author-ModName:
#    required: false          # default: true if enabled in the r2modman profile
#    defaultEnabled: true     # for optional mods
#    configAccess: editable   # overrides defaultConfigAccess for this mod's configs
#    description: "Shown to players instead of the Thunderstore description"
#    lockedSettings:          # in editable files: always reset to the pack's value
#      - { file: com.author.modname.cfg, section: General, key: SomeSetting }

# Config files or folders the import couldn't match to a mod. Only needed when that mod's
# configAccess differs from defaultConfigAccess.
configOwners: {}
#  BepInEx/config/Seasonality/: RustyMods-Seasonality
#  odd-name.cfg: Author-ModName
